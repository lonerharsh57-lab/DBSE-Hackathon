server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown path returns the app shell so
    # react-router can handle /locations, /home, /admin/... on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached hard; index.html must not be.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
